[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "1.0.0"
description = "AI Code Reviewer Bot — offline, deterministic code review for Python: AST + pattern rules find bugs, security issues and quality problems in files or PR diffs, with a scored verdict and a concrete fix for every finding. No LLM, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "code-review",
    "ai-code-reviewer",
    "static-analysis",
    "pull-request",
    "security",
    "bug-detection",
    "offline-ai",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
reviewbot = "reviewbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
